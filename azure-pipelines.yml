trigger:
- master

pr:
- master

variables:
  nodeVersion: '20.18.3'

stages:
- stage: PlaywrightTests
  displayName: Playwright Tests
  jobs:
  - job: Edge_1_of_6
    displayName: Microsoft Edge 1/6
    pool:
      vmImage: 'windows-latest'
    timeoutInMinutes: 60
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: Install Node.js
    - script: npm ci
      displayName: Install dependencies
    - powershell: |
        $edgePath = "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe"
        if (-not (Test-Path $edgePath)) {
          $edgePath = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
        }
        if (-not (Test-Path $edgePath)) {
          throw "Microsoft Edge browser is not available on this agent."
        }
        Write-Host "Microsoft Edge found at $edgePath"
      displayName: Verify Microsoft Edge availability
    - script: npx playwright install --with-deps
      displayName: Install CI browsers
    - script: npx playwright test --project="Microsoft Edge" --shard=1/6
      displayName: Run Playwright tests
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'blob-report'
        artifact: 'blob-report-microsoft-edge-1-of-6'
      condition: always()
      displayName: Upload blob report
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'allure-results'
        artifact: 'allure-results-microsoft-edge-1-of-6'
      condition: always()
      displayName: Upload Allure results

