  - job: MergeReports
    displayName: Merge Reports
    dependsOn:
    - Edge_1_of_6
    - Edge_2_of_6
    - Edge_3_of_6
    - Edge_4_of_6
    - Edge_5_of_6
    - Edge_6_of_6
    - Safari_1_of_6
    - Safari_2_of_6
    - Safari_3_of_6
    - Safari_4_of_6
    - Safari_5_of_6
    - Safari_6_of_6
    condition: always()
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: Install Node.js
    - script: npm ci
      displayName: Install dependencies
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        itemPattern: 'blob-report-*'
        targetPath: 'blob-report-download'
      displayName: Download blob reports
    - powershell: |
        New-Item -ItemType Directory -Force -Path blob-report-merged | Out-Null
        Get-ChildItem -Path blob-report-download -Recurse -File | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination (Join-Path 'blob-report-merged' $_.Name) -Force
        }
      displayName: Flatten blob reports
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        itemPattern: 'allure-results-*'
        targetPath: 'allure-results-download'
      displayName: Download Allure results
    - powershell: |
        New-Item -ItemType Directory -Force -Path allure-results-merged | Out-Null
        Get-ChildItem -Path allure-results-download -Recurse -File | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination (Join-Path 'allure-results-merged' $_.Name) -Force
        }
      displayName: Flatten Allure results
    - script: npx playwright merge-reports --reporter html ./blob-report-merged
      displayName: Merge Playwright reports
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'playwright-report'
        artifact: 'playwright-report'
      displayName: Upload final HTML report
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'allure-results-merged'
        artifact: 'allure-results'
      displayName: Upload Allure results artifact



