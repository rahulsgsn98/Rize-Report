name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/8
            shard_name: 1-of-8
          - shard: 2/8
            shard_name: 2-of-8
          - shard: 3/8
            shard_name: 3-of-8
          - shard: 4/8
            shard_name: 4-of-8
          - shard: 5/8
            shard_name: 5-of-8
          - shard: 6/8
            shard_name: 6-of-8
          - shard: 7/8
            shard_name: 7-of-8
          - shard: 8/8
            shard_name: 8-of-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --workers=1 --shard=${{ matrix.shard }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard_name }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: always()
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: blob-report

      - name: Merge Playwright Reports
        run: npx playwright merge-reports --reporter html ./blob-report

      - name: Upload Final HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
